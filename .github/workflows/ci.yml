# Build RH on Linux and macOS with several compilers and run the unit tests.
# The regression suite compares each change with a build of its base commit
# (the target branch before the change, also for a pull request stacked on
# another one), which must match unless the pull
# request carries the label "changes-results" (an intended change of
# results: then the differences are only reported). A second comparison with upstream RH
# (c95bdf6) reports how far the results have drifted from it; it never
# fails, but differences there need an explanation in the log. On a pull
# request it runs only with that label or when the comparison with the base
# fails: otherwise the results match the base, and so does their drift (Q-27).

name: CI

# Changes that only touch documentation, or the files used only by the local
# stress suite (tests/run_stress.sh and what it alone uses), skip CI: nothing
# CI builds or runs is affected. So do changes that only touch the shipped
# input data (Atoms/, Atmos/, Molecules/): the regression suite runs the
# candidate, base and upstream builds on the candidate's data, so a change of
# data alone compares the base code with itself. Such pull requests carry the
# label "changes-data". Any other file in the change, including the unit and
# end-to-end tests (and their own data in tests/) and the regression harness,
# runs everything.
on:
  push:
    branches: [modernize]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE', '.git-blame-ignore-revs', 'tests/run_stress.sh', 'tests/analyze_run.py', 'tests/make_perturbed_atmos.py', 'tests/make_bifrost_atmos.py', 'tests/se_residual.py', 'tests/make_references.sh', 'tests/atmos/**', 'Atoms/**', 'Atmos/**', 'Molecules/**']
  pull_request:
    # Any base branch: a pull request stacked on another one (based on its
    # branch, not on modernize) is checked against its own base too (Q-23)
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE', '.git-blame-ignore-revs', 'tests/run_stress.sh', 'tests/analyze_run.py', 'tests/make_perturbed_atmos.py', 'tests/make_bifrost_atmos.py', 'tests/se_residual.py', 'tests/make_references.sh', 'tests/atmos/**', 'Atoms/**', 'Atmos/**', 'Molecules/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UPSTREAM_REPO: han-uitenbroek/RH
  UPSTREAM_REF: c95bdf66ff6bc1c6cea0ed04dc688100170e8ee6

defaults:
  run:
    shell: bash       # -eo pipefail: a failing command before | tee fails the step

jobs:
  format:
    name: code format (clang-format)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: clang-format
        run: pip install clang-format==19.1.7
      - name: Check formatting
        run: |
          git ls-files '*.c' '*.h' | grep -v '_reference\.h$' |
            xargs clang-format --dry-run --Werror

  build:
    name: build (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, cc: gcc }
          - { os: ubuntu-26.04, cc: clang }
          - { os: macos-26, cc: clang }       # Apple silicon
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libtirpc-dev ninja-build
      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_C_COMPILER=${{ matrix.cc }} -DRH_WARNINGS=ON -DRH_WERROR=ON
      - name: Build
        run: cmake --build build 2>&1 | tee build.log
      - name: Warnings
        run: |
          n=$(grep -c 'warning:' build.log || true)
          echo "$n compiler warnings"
          echo "### ${{ matrix.os }} ${{ matrix.cc }}: $n compiler warnings" >> "$GITHUB_STEP_SUMMARY"
      - name: Runner CPU and libc
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            grep -m1 'model name' /proc/cpuinfo
            echo "flags: $(grep -m1 -wo -e fma -e avx2 -e avx512f /proc/cpuinfo | tr '\n' ' ')"
            ldd --version | head -1
          else
            sysctl -n machdep.cpu.brand_string; sw_vers -productVersion
          fi
      - name: Unit and smoke tests
        run: ctest --test-dir build --output-on-failure

  regression:
    name: regression (${{ matrix.os }}${{ matrix.sanitize && ', with sanitizers' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, cc: gcc, sanitize: "address,undefined" }
          - { os: macos-26, cc: clang }
    permissions:
      contents: read
      pull-requests: read   # labels of the merged pull request on push
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # The label "changes-results" on the pull request. A push to modernize
      # carries no labels, so there it is looked up on the pull request that
      # the pushed commit merged ("Merge pull request #N" in its message, else
      # the pull request GitHub associates with the commit); without the
      # lookup every merge of an intended change of results failed (Q-26).
      - name: Label changes-results
        env:
          GH_TOKEN: ${{ github.token }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          case "${{ github.event_name }}" in
            pull_request) labels=$(jq -r '.[]' <<< "$PR_LABELS") ;;
            push)
              pr=$(git log -1 --format=%s | sed -nE 's/^Merge pull request #([0-9]+) .*/\1/p')
              if [ -z "$pr" ]; then
                pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
                       --jq ".[] | select(.merge_commit_sha == \"$GITHUB_SHA\") | .number" | head -1)
              fi
              labels=
              if [ -n "$pr" ]; then
                labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/labels" --jq '.[].name')
                echo "Merged pull request: #$pr" >> "$GITHUB_STEP_SUMMARY"
              fi ;;
            *) labels= ;;
          esac
          if grep -qx changes-results <<< "$labels"; then v=true; else v=false; fi
          echo "CHANGES_RESULTS=$v" >> "$GITHUB_ENV"
          echo "changes-results: $v"
      - name: Base commit
        id: base
        run: |
          case "${{ github.event_name }}" in
            pull_request) sha=${{ github.event.pull_request.base.sha }} ;;
            push)         sha=${{ github.event.before }} ;;
            *)            sha= ;;
          esac
          if [ -z "$sha" ] || [ "$sha" = 0000000000000000000000000000000000000000 ]; then
            sha=$(git rev-parse HEAD^)
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Base commit: $sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Base RH
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libtirpc-dev ninja-build time
          pip install numpy
      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja
          pip install numpy
      - name: Build base
        run: |
          cmake -S base -B base/build -G Ninja -DCMAKE_C_COMPILER=${{ matrix.cc }} -DRH_BUILD_TOOLS=OFF
          cmake --build base/build
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_C_COMPILER=${{ matrix.cc }}
          cmake --build build
      - name: Build with sanitizers
        if: matrix.sanitize
        run: |
          cmake -B build-san -G Ninja -DCMAKE_C_COMPILER=${{ matrix.cc }} \
                -DRH_SANITIZE=${{ matrix.sanitize }}
          cmake --build build-san
      - name: Runner CPU and libc
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            grep -m1 'model name' /proc/cpuinfo
            echo "flags: $(grep -m1 -wo -e fma -e avx2 -e avx512f /proc/cpuinfo | tr '\n' ' ')"
            ldd --version | head -1
          else
            sysctl -n machdep.cpu.brand_string; sw_vers -productVersion
          fi
      - name: Unit tests with sanitizers
        if: matrix.sanitize
        run: ctest --test-dir build-san -L unit --output-on-failure
      - name: Regression suite against the base commit
        id: regress
        run: |
          set +e
          # The memory case runs on Linux only: what it guards (buffers that
          # grow with Nspect) does not depend on the platform, and macOS
          # peak RSS varies by ~6% between identical builds
          python3 tests/run_tests.py --baseline base/build --candidate . \
            ${{ matrix.sanitize && '--asan build-san' || '' }} \
            ${{ runner.os == 'macOS' && '--skip 2d/mem' || '' }} \
            --work "$RUNNER_TEMP/rh-tests" 2>&1 | tee tests.log
          rc=${PIPESTATUS[0]}
          {
            echo "### Against the base commit"
            [ "$CHANGES_RESULTS" = true ] && echo "Label **changes-results**: differences from the base are reported, not failed."
            echo '```'; grep -E '^(passed|FAILED|\[FAIL\])|vs baseline' tests.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # With the label, only differences from the base may fail
          # (sanitizers, thread counts and memory still count)
          if [ "$CHANGES_RESULTS" = true ]; then
            ! grep -E '^\[FAIL\]' tests.log | grep -qv 'candidate N=1 vs baseline'
            exit $?
          fi
          exit $rc
      # The drift from upstream changes only when the results do: on a pull
      # request without the label that passes the comparison with the base,
      # it is the base's drift. Pushes and manual runs always report it.
      - name: Drift from upstream needed?
        id: drift
        if: ${{ !cancelled() && (steps.regress.outcome == 'success' || steps.regress.outcome == 'failure') }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ] || [ "$CHANGES_RESULTS" = true ] ||
             [ "${{ steps.regress.outcome }}" = failure ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            { echo "### Against upstream RH (report only)"
              echo "Not run: the results match the base commit, so the drift is the base's."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upstream RH
        if: ${{ !cancelled() && steps.drift.outputs.run == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream
      - name: Build upstream
        if: ${{ !cancelled() && steps.drift.outputs.run == 'true' }}
        run: CC=${{ matrix.cc }} tests/build_upstream.sh upstream
      - name: Drift from upstream (report only)
        if: ${{ !cancelled() && steps.drift.outputs.run == 'true' }}
        run: |
          set +e
          python3 tests/run_tests.py --baseline upstream --candidate . --threads "" \
            --work "$RUNNER_TEMP/rh-upstream" > upstream.log 2>&1
          {
            echo "### Against upstream RH (report only)"
            echo '```'; grep -E 'vs baseline|^passed' upstream.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Keep logs of failed runs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-runs-${{ matrix.os }}
          path: ${{ runner.temp }}/rh-tests/failed
          if-no-files-found: ignore
